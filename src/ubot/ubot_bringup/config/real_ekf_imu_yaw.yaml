# Variant of real_ekf.yaml where the IMU supplies absolute yaw (heading).
#
# With publish.imu.orientation_source: rotation_vector (bno085_params.yaml), the IMU's
# yaw is referenced to magnetic north, so it does not drift the way integrated wheel
# yaw does. The magnetometer can be pulled off by motors and steel indoors, so only use
# this once experiment E7 shows the heading holds up on the robot.
#
# Select with: ros2 launch ubot_bringup real_robot.launch.py ekf_config:=real_ekf_imu_yaw.yaml
ekf_filter_node:
  ros__parameters:

    use_sim_time: false
    frequency: 30.0
    two_d_mode: true

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    publish_tf: true

    # Wheel odometry: velocities only (vx, vyaw). Wheel yaw is not fused, so it does
    # not compete with the IMU's absolute heading.
    odom0: /diff_drive_controller/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    # IMU: absolute yaw + yaw angular velocity
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
