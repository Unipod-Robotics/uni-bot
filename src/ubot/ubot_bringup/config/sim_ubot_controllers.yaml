controller_manager:
  ros__parameters:
    update_rate: 50  # Hz
    use_sim_time: true

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

diff_drive_controller:
  ros__parameters:
    # All four wheels. The real robot commands only the front motors and its ESP32 mirrors
    # each command to the rear motor on the same side, so all four are driven; in Gazebo that
    # mirroring is explicit (ubot_description/urdf/body/ubot_wheel.urdf.xacro, rear_mimic).
    left_wheel_names: ["front_left_wheel_joint", "rear_left_wheel_joint"]
    right_wheel_names: ["front_right_wheel_joint", "rear_right_wheel_joint"]

    # EFFECTIVE separation, not the geometric track (0.2264 m): a 4-wheel skid-steer scrubs its
    # tyres to turn, so it rotates slower than the track predicts. Calibrated against Gazebo
    # ground truth on 2026-10-01 with `ros2 run ubot_bench diag separation`: steady in-place turns
    # at 0.3 / 0.6 / 1.0 rad/s all gave true/commanded = 1.045 with the old 0.264204, so the
    # effective separation is 0.264204 / 1.045 = 0.2528 m (rate-independent).
    # The real robot is calibrated separately (0.4192 m in ubot_controllers.yaml): its rubber
    # tyres scrub far more. Each platform is calibrated against its own ground truth; re-run the
    # diag test after any change to the chassis, wheels, mass or friction.
    wheel_separation: 0.2528
    wheel_radius: 0.0325   # wheel_radius (Inspection Robot 01 CAD)

    # Odometry settings
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: false


    # Add these to prevent resets
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.03]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.03]
    open_loop: false

    # Constraints for smooth movement
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 1.0
        min_velocity: -1.0
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 2.0
        min_velocity: -2.0

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
    # ADD THESE NEW LINES BELOW:
    qos_overrides:
      /joint_states:
        publisher:
          durability: volatile
          reliability: reliable

          
imu_sensor_broadcaster:
  ros__parameters:
    frame_id: imu_link
    sensor_name: imu_sensor
    