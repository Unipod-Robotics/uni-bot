ekf_filter_node:
  ros__parameters:

    use_sim_time: true
    frequency: 50.0
    two_d_mode: true

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    publish_tf: true

    # Wheel odometry: velocities only (vx, vyaw), matching real_ekf.yaml.
    # Fusing the wheels' absolute x (but not y) and yaw corrected the pose along the odom
    # x axis only and let the wheel heading override the IMU; after a 90 deg turn the
    # fused pose ran 26 cm off Gazebo ground truth over a 4 m L-shaped drive.
    odom0: /diff_drive_controller/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    # IMU: fuse yaw angular velocity only (same topic and fields as the real robot).
    # Avoids noisy linear accelerations in 2D mode.
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
